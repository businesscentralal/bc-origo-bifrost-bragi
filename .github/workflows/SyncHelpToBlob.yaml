name: Sync Help & SKILL.md to Azure Blob

# Ports the three steps that already exist in the ADO "Bifrost" (PTE) pipeline
# (.devops/azure-pipeline.yml -> OnSetupDeploymentTasks) so this GitHub-hosted
# AppSource copy of the app keeps origopublic blob storage in sync too:
#   1. Convert documentation Markdown (app/docs/**) to styled HTML (app/Help/**)
#   2. Inject SKILL.md into the en-US help folder
#   3. Upload everything under app/Help to origopublic/help/BifrostBragi/bc{version}/...
#
# Content lives in this same repo checkout, so unlike the equivalent workflow in
# origo-bc-mcp, no cross-repo fetch is needed here.

on:
  push:
    branches: [main]
    paths:
      - 'app/docs/**'
      - 'app/skill/**'
      - 'app/Help/**'
      - 'app/app.json'
  workflow_dispatch: {}

defaults:
  run:
    shell: powershell

env:
  BLOB_CONTAINER: help
  BLOB_REPO_FOLDER: BifrostBragi

jobs:
  sync-help:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve major version from app.json
        run: |
          $appJson = Get-Content "app/app.json" -Raw | ConvertFrom-Json
          if ($appJson.version -notmatch '^(\d+)\.') {
              Write-Error "Could not parse major version from app.json version '$($appJson.version)'"
              exit 1
          }
          $majorVersion = $Matches[1]
          Write-Output "Resolved major version: $majorVersion (from app.json version $($appJson.version))"
          "MAJOR_VERSION=$majorVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Convert documentation Markdown to HTML
        run: |
          # Pinned SHA256 of the known-good script content. If the script is intentionally
          # updated at the source, recompute with:
          #   (Get-FileHash -Path <downloaded file> -Algorithm SHA256).Hash
          # and update the value below - do not remove this check to "fix" a mismatch.
          $expectedHash = "680D67D7562720B1781CC698D9A99141F28BEED739FEDAA91290B9C835C5D3AC"

          $scriptUrl = "https://origopublic.blob.core.windows.net/resources/build/convert-docs-to-html.ps1"
          $scriptPath = Join-Path "$env:RUNNER_TEMP" "convert-docs-to-html.ps1"
          Invoke-WebRequest -Uri $scriptUrl -OutFile $scriptPath -UseBasicParsing

          $actualHash = (Get-FileHash -Path $scriptPath -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
              Write-Error "convert-docs-to-html.ps1 hash mismatch (expected $expectedHash, got $actualHash). Refusing to execute an unverified script."
              exit 1
          }

          & $scriptPath -RepoRoot "$env:GITHUB_WORKSPACE"

      - name: Inject SKILL.md into help folder
        run: |
          $skillFilePath = Join-Path "$env:GITHUB_WORKSPACE" "app/skill/SKILL.md"
          $skillFile = Get-Item -LiteralPath $skillFilePath -ErrorAction SilentlyContinue

          if ($null -eq $skillFile) {
              Write-Warning "SKILL.md not found at: $skillFilePath - skipping."
              exit 0
          }

          Write-Output "SKILL.md found: $($skillFile.FullName)"

          $helpEnUsPath = Join-Path "$env:GITHUB_WORKSPACE" "app/Help/en-US"

          if (-Not (Test-Path $helpEnUsPath)) {
              Write-Warning "Help en-US folder not found at: $helpEnUsPath - skipping."
              exit 0
          }

          $destPath = Join-Path $helpEnUsPath "SKILL.md"
          Copy-Item -Path $skillFile.FullName -Destination $destPath -Force
          Write-Output "Copied SKILL.md to: $destPath"

          $indexPath = Join-Path $helpEnUsPath "index.html"

          if (-Not (Test-Path $indexPath)) {
              Write-Warning "index.html not found at: $indexPath - link not added."
              exit 0
          }

          $rawContent = Get-Content $indexPath -Raw
          if ($rawContent -match 'SKILL\.md') {
              Write-Output "SKILL.md link already present in index.html - skipping."
              exit 0
          }

          $lines = Get-Content $indexPath
          $lastTbodyIdx = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^\s*</tbody>') { $lastTbodyIdx = $i }
          }

          if ($lastTbodyIdx -lt 0) {
              Write-Warning "Could not locate </tbody> in index.html - link not added."
              exit 0
          }

          $newRow = @(
              '        <tr>',
              '            <td><a href="SKILL.md">Integration Skill Guide (SKILL.md)</a></td>',
              '            <td>AI coding skill guide for integrators building against Bifrost Bragi.</td>',
              '        </tr>'
          )
          $newLines = $lines[0..($lastTbodyIdx - 1)] + $newRow + $lines[$lastTbodyIdx..($lines.Count - 1)]
          Set-Content -Path $indexPath -Value $newLines -Encoding utf8
          Write-Output "Added SKILL.md link to index.html"

      - name: Upload help files to Azure Blob Storage
        env:
          STORAGE_BASE_URL: ${{ secrets.STORAGE_BASE_URL }}
          STORAGE_SAS_TOKEN: ${{ secrets.STORAGE_SAS_TOKEN }}
        run: |
          $helpFolderPath = Join-Path "$env:GITHUB_WORKSPACE" "app/Help"

          if (-Not (Test-Path $helpFolderPath)) {
              Write-Error "Help folder not found at: $helpFolderPath"
              exit 1
          }

          $baseURL = $env:STORAGE_BASE_URL
          $sasToken = $env:STORAGE_SAS_TOKEN

          if ([string]::IsNullOrWhiteSpace($baseURL)) { Write-Error "STORAGE_BASE_URL secret is not set."; exit 1 }
          if ([string]::IsNullOrWhiteSpace($sasToken)) { Write-Error "STORAGE_SAS_TOKEN secret is not set."; exit 1 }
          if (-not $baseURL.EndsWith('/')) { $baseURL = "$baseURL/" }
          if (-not $sasToken.StartsWith('?')) { $sasToken = "?$sasToken" }

          $helpFiles = Get-ChildItem -Path $helpFolderPath -Recurse -File
          Write-Output "Found $($helpFiles.Count) help file(s) to upload (target: bc$env:MAJOR_VERSION)"

          $uploaded = 0
          $failed = 0

          foreach ($helpFile in $helpFiles) {
              $relativePath = $helpFile.FullName.Substring($helpFolderPath.Length + 1).Replace('\', '/')
              $blobPath = "$env:BLOB_REPO_FOLDER/bc$env:MAJOR_VERSION/$relativePath"   # human-readable, used only for logging

              # Encode each path segment individually (not the "/" separators) so folder
              # names with spaces (e.g. "Bifrost") produce a valid URL.
              $encodedSegments = $blobPath.Split('/') | ForEach-Object { [Uri]::EscapeDataString($_) }
              $encodedBlobPath = $encodedSegments -join '/'
              $url = $baseURL + $env:BLOB_CONTAINER + "/" + $encodedBlobPath + $sasToken

              $contentType = switch ($helpFile.Extension.ToLower()) {
                  '.html' { 'text/html' }
                  '.htm'  { 'text/html' }
                  '.css'  { 'text/css' }
                  '.js'   { 'application/javascript' }
                  '.json' { 'application/json' }
                  '.xml'  { 'application/xml' }
                  '.txt'  { 'text/plain' }
                  '.md'   { 'text/markdown' }
                  default { 'application/octet-stream' }
              }

              try {
                  $uploadHeaders = @{ 'x-ms-blob-type' = 'BlockBlob'; 'Content-Type' = $contentType }
                  $response = Invoke-WebRequest -Uri $url -Method PUT -Headers $uploadHeaders -InFile $helpFile.FullName -UseBasicParsing
                  Write-Output "  OK ($($response.StatusCode)): $relativePath -> $blobPath"
                  $uploaded++
              } catch {
                  # Deliberately not logging $_/the exception message - it can echo the
                  # request URI, which contains the SAS token. Log only the HTTP status.
                  $statusCode = $null
                  if ($_.Exception.Response) { $statusCode = [int]$_.Exception.Response.StatusCode }
                  $statusText = if ($statusCode) { $statusCode } else { "unknown" }
                  Write-Warning "  FAILED: $relativePath (HTTP status: $statusText)"
                  $failed++
              }
          }

          Write-Output "Upload summary: $uploaded succeeded, $failed failed, $($helpFiles.Count) total"
          if ($failed -gt 0) { exit 1 }
